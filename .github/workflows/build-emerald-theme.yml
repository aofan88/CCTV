name: Build Emerald Theme

on:
  push:
    branches:
      - main
    paths:
      - 'cf-server-monitor-theme-emerald-main/**'
      - '.github/workflows/build-emerald-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install theme dependencies
        working-directory: cf-server-monitor-theme-emerald-main
        run: bun install --frozen-lockfile

      - name: Build theme
        working-directory: cf-server-monitor-theme-emerald-main
        run: bun run build

      - name: Publish built theme branch
        env:
          THEME_VERSION: ${{ github.sha }}
        run: |
          cp -r cf-server-monitor-theme-emerald-main/dist /tmp/emerald-dist

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --exit-code --heads origin theme-build; then
            git fetch origin theme-build:refs/remotes/origin/theme-build
            git worktree add -B theme-build /tmp/theme-build origin/theme-build
          else
            git worktree add --detach /tmp/theme-build
            cd /tmp/theme-build
            git switch --orphan theme-build
          fi

          cd /tmp/theme-build
          git rm -r --ignore-unmatch .
          cp -r /tmp/emerald-dist/. .
          git add -A
          git commit --allow-empty -m "chore: build Emerald theme ${THEME_VERSION}"
          git push origin theme-build
